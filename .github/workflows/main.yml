name: Bina APK proTV

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Semak link siaran (salinan sandaran dalam APK)
        run: node scripts/build-channels.mjs

      - name: Sediakan folder www
        run: |
          mkdir www
          cp -r index.html manifest.webmanifest sw.js assets icons data www/
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO="${GITHUB_REPOSITORY#*/}"
          URL="https://${OWNER}.github.io/${REPO}/data/channels.json"
          sed -i "s#<script>#<script>window.PROTV_DATA_URL='${URL}';#" www/index.html
          grep -c "PROTV_DATA_URL" www/index.html

      - name: Pasang Capacitor dan projek Android
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          cp -r android-res/* android/app/src/main/res/
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          npx cap sync android

      - name: Bina APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Siapkan fail APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk protv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: protv-apk
          path: protv.apk

      - name: Letak APK dalam Releases (senang muat turun dari telefon)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --title "proTV APK" --notes "APK proTV terkini"
          gh release upload apk-latest protv.apk --clobber
